<a
  href="#main"
  class="sr-only rounded-md bg-primary px-4 py-3 text-on-primary focus:not-sr-only focus:m-2 focus:inline-block focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-bg focus-visible:outline-none"
  (click)="skipToMain($event)"
>
  {{ 'app.skipToMain' | transloco }}
</a>

<div
  class="flex min-h-dvh flex-col pt-[env(safe-area-inset-top)] pr-[env(safe-area-inset-right)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)]"
>
  <header class="border-b border-border bg-surface">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-2">
      <a
        routerLink="/"
        class="inline-flex min-h-11 items-center rounded-md px-2 text-lg font-bold focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-none"
      >
        {{ 'app.name' | transloco }}
      </a>
      <app-language-switch />
    </div>
  </header>

  <main
    #main
    id="main"
    tabindex="-1"
    class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 focus:outline-none"
  >
    <router-outlet />
  </main>

  <footer class="border-t border-border bg-surface">
    <p class="mx-auto max-w-5xl px-4 py-3 text-sm text-muted">
      {{ 'app.disclaimer' | transloco }}
    </p>
  </footer>
</div>
