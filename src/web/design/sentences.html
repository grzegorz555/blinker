<!doctype html>
<html lang="pl" data-style="m3" data-page="sentences">
  <head>
    <meta charset="utf-8" />
    <title>Zdania (makieta)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="design.css" />
    <script src="design.js" defer></script>
  </head>
  <body class="bg-bg text-fg">
    <!-- Spec 004: the sentences he has said, to repeat one aloud (R12). An M3 list. Fake data only (R9). -->
    <div class="shell">
      <header class="shell-top">
        <h1 class="title-large">Zdania</h1>
      </header>

      <main class="shell-main">
        <div class="mx-auto grid max-w-3xl grid-cols-1 gap-4">
          <section class="card py-2" aria-labelledby="today-title">
            <h2 id="today-title" class="label-large pt-2 text-muted">Dzisiaj</h2>
            <ul>
              <li class="row-item">
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-lg font-semibold">CHCĘ SIĘ NAPIĆ WODY</span>
                  <span class="text-sm text-muted">10:42</span>
                </span>
                <button
                  type="button"
                  class="btn btn-tonal btn-icon"
                  aria-label="Powtórz na głos: CHCĘ SIĘ NAPIĆ WODY"
                >
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M11 5 6 9H3v6h3l5 4z" />
                    <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                  </svg>
                </button>
              </li>
              <li class="row-item">
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-lg font-semibold">ZMIEŃ POZYCJĘ</span>
                  <span class="text-sm text-muted">9:15</span>
                </span>
                <button
                  type="button"
                  class="btn btn-tonal btn-icon"
                  aria-label="Powtórz na głos: ZMIEŃ POZYCJĘ"
                >
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M11 5 6 9H3v6h3l5 4z" />
                    <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                  </svg>
                </button>
              </li>
            </ul>
          </section>

          <section class="card py-2" aria-labelledby="yesterday-title">
            <h2 id="yesterday-title" class="label-large pt-2 text-muted">Wczoraj</h2>
            <ul>
              <li class="row-item">
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-lg font-semibold">DZIĘKUJĘ</span>
                  <span class="text-sm text-muted">20:03</span>
                </span>
                <button
                  type="button"
                  class="btn btn-tonal btn-icon"
                  aria-label="Powtórz na głos: DZIĘKUJĘ"
                >
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M11 5 6 9H3v6h3l5 4z" />
                    <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                  </svg>
                </button>
              </li>
            </ul>
          </section>
        </div>
      </main>

      <!-- include nav.html -->
    </div>
  </body>
</html>
