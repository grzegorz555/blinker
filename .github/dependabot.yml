version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # Every step of github/codeql-action must run the same version: init and analyze bumped in two PRs fail CodeQL
    # ("Loaded a configuration file for version X, but running version Y"; PRs #53, #54).
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#groups--
    groups:
      codeql-action:
        patterns: ['github/codeql-action*']
  - package-ecosystem: npm
    directory: /src/web
    # Daily: a fix in a pinned tool (vite in @angular/build) arrives within a day, not up to a week later.
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors of Angular and of the tools it pins (TypeScript) move together through `ng update`,
    # never one by one: Angular 22 requires TypeScript >=6.0 <6.1. Security updates still come
    # through, because Dependabot security updates ignore this list.
    ignore:
      - dependency-name: '@angular/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@angular-devkit/*'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
