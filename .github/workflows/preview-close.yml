name: Close preview

# Spec 003: removes the PR's preview environment on Azure Static Web Apps when the PR is closed or merged,
# so the Free plan's three preview slots are freed. Skipped when the deploy token is not available.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  close:
    name: Close preview (Azure)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the deploy token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: AZURE_STATIC_WEB_APPS_API_TOKEN is not available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Close the preview environment
        if: ${{ steps.token.outputs.available == 'true' }}
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''
