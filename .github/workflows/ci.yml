name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (OKF bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check OKF conformance of docs/
        run: node scripts/check-okf.mjs docs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks over the full history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # Spec 002: every gate of `npm run verify` (src/web/scripts/verify.mjs), so CI and the
  # pre-push hook share one definition: docs, Prettier, ESLint, unit, script tests, npm audit,
  # production build, dist/ check (no .map/.md), Playwright + axe on three device projects.
  web:
    name: Web (npm run verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Install Playwright browsers and their OS dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run every gate
        run: npm run verify
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: src/web/playwright-report/
          retention-days: 7
