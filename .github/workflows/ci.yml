name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (OKF bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check OKF conformance of docs/
        run: node scripts/check-okf.mjs docs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks over the full history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # A second vulnerability database next to `npm audit` (GitHub Advisory DB): OSV.dev also
  # merges NVD and other sources. It reads the lockfile only; nothing is installed or run.
  # The image is pinned by digest, like the actions are pinned by SHA.
  vulnerabilities:
    name: Vulnerability scan (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan package-lock.json against OSV.dev
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
          scan source --config /repo/src/web/osv-scanner.toml --lockfile /repo/src/web/package-lock.json

  # Spec 002: the gates of `npm run verify` (src/web/scripts/verify.mjs), so CI and the
  # pre-push hook share one definition: docs, Prettier, ESLint, unit, script tests, npm audit,
  # production build, dist/ check (no .map/.md), mock-ups build. Playwright + axe runs by hand
  # (.github/workflows/e2e.yml or `npm run e2e`), not on every change (the author, 2026-11-17).
  web:
    name: Web (npm run verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Run the gates (without e2e)
        run: npm run verify
      # Spec 003, R8: the build that passed the gates is the build that is deployed (no second build).
      - name: Upload the tested build for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: src/web/dist/blinker-web/browser/
          retention-days: 1

  # Spec 002 (R6, R7): Lighthouse CI, accessibility = 100 for home and 404 in English and Polish.
  # A separate job, so a slow audit doesn't hide the results of the other gates.
  # Reports are kept as a workflow artifact only, never uploaded to public storage.
  lighthouse:
    name: Lighthouse (accessibility = 100)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Lighthouse in English and Polish (uses the runner's Google Chrome)
        run: npm run lighthouse
      - name: Upload the Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: src/web/.lighthouseci/reports-*/
          include-hidden-files: true
          retention-days: 7

  # Spec 003 (R6, R7, R9): a preview environment per PR on Azure Static Web Apps (ADR-0003), then the `deployed`
  # Playwright project against its URL. Skipped, not failed, when the deploy token is not available: before the
  # author's Azure setup, and on Dependabot and fork PRs, which get no secrets.
  deploy-preview:
    name: Deploy preview (Azure)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [docs, secrets, vulnerabilities, web, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the deploy action comments the preview URL on the PR
    steps:
      - name: Check the deploy token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: AZURE_STATIC_WEB_APPS_API_TOKEN is not available (not set up yet, or a Dependabot/fork PR)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ steps.token.outputs.available == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ steps.token.outputs.available == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: deploy/
      - name: Upload the preview
        id: deploy
        if: ${{ steps.token.outputs.available == 'true' }}
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy
          output_location: ''
          skip_app_build: true
      - if: ${{ steps.token.outputs.available == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Test the preview (headers, HTTPS, smoke + axe)
        if: ${{ steps.token.outputs.available == 'true' }}
        working-directory: src/web
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          echo "Preview: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  # Spec 003 (R8, R9): production only on main, only after every gate passed, then the same remote tests.
  # Never cancelled halfway: a newer push waits for the running deploy.
  deploy-production:
    name: Deploy production (Azure)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [docs, secrets, vulnerabilities, web, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Records each run as a GitHub deployment: "production" with the app URL on the repository page.
    # https://docs.github.com/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check the deploy token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: AZURE_STATIC_WEB_APPS_API_TOKEN is not set up yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ steps.token.outputs.available == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ steps.token.outputs.available == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: deploy/
      - name: Upload to production
        id: deploy
        if: ${{ steps.token.outputs.available == 'true' }}
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy
          output_location: ''
          skip_app_build: true
      - if: ${{ steps.token.outputs.available == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Test production (headers, HTTPS, smoke + axe)
        if: ${{ steps.token.outputs.available == 'true' }}
        working-directory: src/web
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          echo "Production: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
