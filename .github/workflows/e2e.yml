name: E2E

# Playwright + axe on the three device projects, by hand only (Actions > E2E > Run workflow).
# The author decided on 2026-11-17 that e2e does not run on every change: e2e tests are added and run
# in batches. The `deployed` project still runs after each deploy in ci.yml (headers, HTTPS, smoke).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Install Playwright browsers and their OS dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Build, build the mock-ups, run Playwright + axe
        run: npm run e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: src/web/playwright-report/
          retention-days: 7
