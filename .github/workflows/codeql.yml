name: CodeQL

# Static analysis of the app code (docs/conventions/git.md: a public repo also gets CodeQL and secret scanning).
# Results appear under Security > Code scanning; the job never deploys anything.
# https://docs.github.com/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # weekly, for new queries on unchanged code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          # Only our code: dependencies, build output and the vendored model are not ours to scan.
          config: |
            paths:
              - src/web/src
              - src/web/scripts
              - src/web/e2e
              - scripts
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
